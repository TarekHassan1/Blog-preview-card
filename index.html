<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./index.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="container">
      <div class="image">
        <img src="illustration-article.svg" alt="drawers" />
      </div>
      <div class="category-published">
        <span class="category">Learning</span>
        <p class="published">Published 21 Dec 2023</p>
      </div>
      <div class="title-text">
        <h2 class="title">HTML& CSS foundations</h2>
        <p class="text">
          Blog description goes here. Lorem ipsum dolor sit amet, consectetur
          adipiscing elit. Fusce vel sapien elit. In malesuada semper mi, nec
          lacinia urna venenatis ac.
        </p>
      </div>
      <div class="publisher">
        <img src="image-avatar.webp" alt="Jane Green" />
        <p class="name">Jane Green</p>
      </div>
    </div>
  </body>
</html>
